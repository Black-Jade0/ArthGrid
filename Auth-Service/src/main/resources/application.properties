server.port=${PORT:8082}
spring.application.name=Auth-Service

# Every ${VAR:default} below reads an environment variable, falling back to the default.

# --- Auth0 ---
# If AUTH0_CLIENT_SECRET is NOT set, the service runs in LOCAL MODE:
# it skips Auth0 and creates a fake "local-<uuid>" user id instead (see service/Auth_service.java).
auth0.domain=dev-ix2m864mt4air3qt.us.auth0.com
auth0.clientId=BlEeypQ15IahquOOEnbwJwANc2FNmzG7
auth0.clientSecret=${AUTH0_CLIENT_SECRET:}

# Where the "set your password" link lands afterwards (your frontend)
app.frontend-url=${FRONTEND_URL:http://localhost:5173/}

# --- Kafka ---
# Configured in Config/KafkaConfig.java from env vars:
# KAFKA_URL (default localhost:9092) + optional KAFKA_CA_CERT / KAFKA_ACCESS_CERT / KAFKA_ACCESS_KEY for SSL.

# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${SERVICE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# --- Logging: our own code at INFO, frameworks quiet ---
logging.level.root=WARN
logging.level.com.Prakhar=INFO
logging.level.org.apache.kafka=ERROR

spring.main.banner-mode=off
