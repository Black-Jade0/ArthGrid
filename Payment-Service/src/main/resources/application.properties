server.port=${PORT:8084}
spring.application.name=Payment-Service

# Every ${VAR:default} below reads an environment variable, falling back to the default.
# Defaults = "running on your laptop with docker-compose infra". The cloud sets real values.

# --- MySQL Database Settings ---
# useSSL=true&requireSSL=false = use SSL if the server offers it (Aiven does, local MySQL 8 does too)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:payment_db}?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Feign Client Config (calls to Accounts-Service) ---
# Accounts URL: env var ACCOUNTS_SERVICE_URL, default http://localhost:8083 (see Client/AccountsClient.java)
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# --- Kafka ---
# Configured in Config/KafkaConfig.java from env vars:
# KAFKA_URL (default localhost:9092) + optional KAFKA_CA_CERT / KAFKA_ACCESS_CERT / KAFKA_ACCESS_KEY for SSL.

# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${SERVICE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# --- Logging: our own code at INFO, frameworks quiet ---
logging.level.root=WARN
logging.level.com.Prakhar=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.apache.kafka=ERROR

spring.main.banner-mode=off
