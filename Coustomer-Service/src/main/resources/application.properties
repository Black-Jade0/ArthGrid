spring.application.name=Customer-Service
server.port=${PORT:8081}

# --- MySQL Database Settings ---
# Local Docker ke liye 'mysql-db' use karega, Aiven ke liye hum DB_HOST provide karenge
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-db}:${DB_PORT:3306}/${DB_NAME:bank_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
   #---Nikku@456
  #---${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Auth0 Settings ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-ix2m864mt4air3qt.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://bank-api

# --- Eureka Client Settings ---
# Cloud par URL badalne ke liye EUREKA_SERVER_URL use karenge
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Render par hostname variable use karna better hai
eureka.instance.hostname=${SERVICE_HOSTNAME}
eureka.instance.prefer-ip-address=true

logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.apache.catalina=ERROR
logging.level.org.apache.coyote=ERROR

spring.main.banner-mode=off