spring.application.name=Customer-Service
server.port=${PORT:8081}

# Every ${VAR:default} below reads an environment variable, falling back to the default.
# Defaults = "running on your laptop with docker-compose infra". The cloud sets real values.

# --- MySQL Database Settings ---
# Local: MySQL from docker-compose, exposed on localhost:3307 (password "root")
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:bank_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Security ---
# true = require an Auth0 JWT on protected endpoints; false = everything open (local testing)
app.security.enabled=${SECURITY_ENABLED:true}

# --- Auth0 Settings (only used when security is enabled) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-ix2m864mt4air3qt.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://bank-api

# --- Other services this one calls (Feign) ---
# Set via env vars ACCOUNTS_SERVICE_URL / AUTH_SERVICE_URL.
# Defaults (http://localhost:8083 and :8082) live in Client/AccountClient.java and Client/AuthUserClient.java

# --- Eureka Client Settings ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${SERVICE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# --- Logging: our own code at INFO, frameworks quiet ---
logging.level.root=WARN
logging.level.com.Prakhar=INFO
logging.level.org.hibernate.SQL=OFF

spring.main.banner-mode=off
