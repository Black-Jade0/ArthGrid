# ArthGrid - run the whole stack locally with ONE command:
#
#     docker compose up --build
#
# First build takes a while (Maven downloads dependencies for 7 services).
#
# What you get on your laptop:
#   API Gateway (use this)  http://localhost:9090
#   Eureka dashboard        http://localhost:8761
#   Kafka UI                http://localhost:8090
#   Mailpit (fake inbox)    http://localhost:8025   <- all emails the app "sends" land here
#   MySQL                   localhost:3307  user: root  password: root
#   Services (direct)       8081 customer, 8082 auth, 8083 accounts, 8084 payment, 8085 notification
#
# Local mode = no Auth0, no Aiven Kafka, no Gmail needed. See README.md.

# Settings shared by every Spring Boot service
x-spring-env: &spring-env
  EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
  JAVA_TOOL_OPTIONS: "-Xmx256m"   # keep each JVM small so 7 of them fit on a laptop

x-db-env: &db-env
  DB_HOST: mysql-db
  DB_PORT: "3306"        # inside Docker, MySQL is on its normal port
  DB_USER: root
  DB_PASSWORD: root

services:

  # ---------- Infrastructure ----------

  mysql-db:
    image: mysql:8.0
    container_name: bank-mysql
    ports:
      - "3307:3306"      # 3307 on your laptop, so it won't clash with a MySQL you may already have
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # creates the 4 databases on first start
      - mysql-data:/var/lib/mysql                            # keeps your data between restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    # Single-node Kafka in KRaft mode (no Zookeeper needed)
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"      # for services you run on your laptop (IntelliJ / mvnw): localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL = used by containers (kafka:29092), EXTERNAL = used from your laptop (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"   # topics user-events / payment-events get created on first use

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: arthgrid-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  mailpit:
    # Fake SMTP server + web inbox. Replaces Gmail locally.
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025"      # web UI
      - "1025:1025"      # SMTP

  # ---------- Spring Cloud plumbing ----------

  eureka-server:
    build: ./Service_Registry
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"

  api-gateway:
    build: ./Apigateway
    container_name: api-gateway
    ports:
      - "9090:9090"
    environment:
      <<: *spring-env
      AUTH_SERVICE_URL: http://auth-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      ACCOUNTS_SERVICE_URL: http://accounts-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      - eureka-server
    restart: on-failure

  # ---------- Business services ----------

  auth-service:
    build: ./Auth-Service
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      <<: *spring-env
      KAFKA_URL: kafka:29092
      # AUTH0_CLIENT_SECRET is intentionally NOT set -> local mode (no Auth0)
    depends_on:
      - eureka-server
      - kafka
    restart: on-failure

  customer-service:
    build: ./Coustomer-Service
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: bank_db
      SECURITY_ENABLED: "false"       # no Auth0 JWT needed locally
      AUTH_SERVICE_URL: http://auth-service:8082
      ACCOUNTS_SERVICE_URL: http://accounts-service:8083
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure

  accounts-service:
    build: ./Accounts-Service
    container_name: accounts-service
    ports:
      - "8083:8083"
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: account_db
      SECURITY_ENABLED: "false"       # no Auth0 JWT needed locally
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure

  payment-service:
    build: ./Payment-Service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: payment_db
      KAFKA_URL: kafka:29092
      ACCOUNTS_SERVICE_URL: http://accounts-service:8083
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: on-failure

  notification-service:
    build: ./Notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      <<: [*spring-env, *db-env]
      DB_NAME: notification_db
      KAFKA_URL: kafka:29092
      MAIL_HOST: mailpit              # fake inbox instead of Gmail
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
      mailpit:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: on-failure

volumes:
  mysql-data:
