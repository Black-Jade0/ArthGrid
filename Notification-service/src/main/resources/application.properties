server.port=${PORT:8085}
spring.application.name=Notification-service

# Every ${VAR:default} below reads an environment variable, falling back to the default.
# Defaults = "running on your laptop with docker-compose infra". The cloud sets real values.

# --- Database ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:notification_db}?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# --- Kafka ---
# Configured in Config/KafkaConsumerConfig.java from env vars:
# KAFKA_URL (default localhost:9092) + optional KAFKA_CA_CERT / KAFKA_ACCESS_CERT / KAFKA_ACCESS_KEY for SSL.

# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${SERVICE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Email ---
# Default: real Gmail (needs MAIL_PASSWORD = a Gmail app password).
# Local: docker-compose overrides these to use Mailpit, a fake inbox you open at http://localhost:8025
#   MAIL_HOST=localhost MAIL_PORT=1025 MAIL_SMTP_AUTH=false MAIL_STARTTLS=false
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:prakharietdavv@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# --- Logging: our own code at INFO, frameworks quiet ---
logging.level.root=WARN
logging.level.com.Prakhar=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.apache.kafka=ERROR

spring.main.banner-mode=off
